name: WhatsApp Deployment Notification

on:
  push:
    branches: [ main ]
  pull_request:
    types: [closed]
    branches: [ main ]

jobs:
  notify:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Send WhatsApp Notification
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          RECIPIENT_PHONE: ${{ secrets.RECIPIENT_PHONE }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > send-notification.js << 'EOF'
          const https = require('https');
          
          const eventType = process.env.EVENT_NAME === 'push' ? 'Direct Push' : 'Merged PR';
          const author = process.env.EVENT_NAME === 'push' ? process.env.ACTOR : process.env.PR_USER;
          const message = process.env.EVENT_NAME === 'push' ? process.env.COMMIT_MESSAGE : process.env.PR_TITLE;
          
          const whatsappMessage = `🎉 Deployment Alert!\n\nEvent: ${eventType}\nBranch: main\nAuthor: ${author}\nRepository: ${process.env.REPOSITORY}\nMessage: ${message || 'No message'}\nTime: ${new Date().toISOString()}`;
          
          const data = JSON.stringify({
            messaging_product: "whatsapp",
            to: process.env.RECIPIENT_PHONE,
            type: "text",
            text: {
              body: whatsappMessage
            }
          });
          
          const options = {
            hostname: 'graph.facebook.com',
            port: 443,
            path: `/v18.0/${process.env.WHATSAPP_PHONE_ID}/messages`,
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${process.env.WHATSAPP_TOKEN}`,
              'Content-Length': data.length
            }
          };
          
          const req = https.request(options, (res) => {
            let responseData = '';
            
            res.on('data', (chunk) => {
              responseData += chunk;
            });
            
            res.on('end', () => {
              console.log('Status Code:', res.statusCode);
              console.log('Response:', responseData);
              
              if (res.statusCode !== 200 && res.statusCode !== 201) {
                console.error('Failed to send WhatsApp message');
                process.exit(1);
              } else {
                console.log('WhatsApp message sent successfully!');
              }
            });
          });
          
          req.on('error', (error) => {
            console.error('Request error:', error);
            process.exit(1);
          });
          
          req.write(data);
          req.end();
          EOF
          
          node send-notification.js
